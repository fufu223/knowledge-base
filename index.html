<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Fastsun Platform 知识库</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="Fastsun 平台框架完整技术文档">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="theme-color" content="#f7f8fb">

  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="theme-modern.css">
</head>
<body>
  <header class="kb-topbar" aria-label="知识库顶部导航">
    <div class="kb-topbar-inner">
      <button class="kb-menu-button" type="button" aria-label="打开导航" aria-expanded="false">
        <span></span>
        <span></span>
      </button>

      <a class="kb-brand" href="#/" aria-label="Fastsun 知识库首页">
        <img src="images/logo.png" alt="" class="kb-brand-logo">
        <span class="kb-brand-copy">
          <span class="kb-brand-name">Fastsun</span>
          <span class="kb-brand-subtitle">Platform Docs</span>
        </span>
      </a>

      <div class="kb-search-shell" id="kb-search-slot" role="search" aria-label="搜索文档">
        <span class="kb-search-placeholder">搜索文档、模块或配置项</span>
      </div>

      <div class="kb-topbar-actions">
        <label class="kb-version" for="branch-select">
          <span>版本</span>
          <select id="branch-select" onchange="switchBranch(this.value)">
            <option value="2.3.26-20260509-1-RELEASE" selected>2.3.26</option>
          </select>
        </label>

        <button class="kb-icon-button theme-toggle" type="button" onclick="toggleTheme()" title="切换深色模式" aria-label="切换深色模式">
          <span id="theme-icon" aria-hidden="true">☾</span>
        </button>

        <button class="kb-asuka" type="button" onclick="toggleAsukaMessage()" title="明日香文档助手" aria-label="明日香文档助手">
          <img src="images/anime-helper.png" alt="明日香" class="kb-asuka-img">
          <span class="kb-asuka-message" id="asuka-message">工作辛苦了</span>
        </button>
      </div>
    </div>
  </header>

  <div class="kb-mobile-scrim" aria-hidden="true"></div>
  <div id="app">加载中...</div>

  <script>
    window.__FASTSUN_MERMAID_THEME__ = {
      theme: 'base',
      securityLevel: 'loose',
      startOnLoad: false,
      fontFamily: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif',
      themeVariables: {
        background: '#ffffff',
        primaryColor: '#f7f9fc',
        primaryTextColor: '#111827',
        primaryBorderColor: '#d9e1ec',
        secondaryColor: '#eef6ff',
        secondaryTextColor: '#111827',
        secondaryBorderColor: '#c8d9ee',
        tertiaryColor: '#f6f2ff',
        tertiaryTextColor: '#111827',
        tertiaryBorderColor: '#d7c8ff',
        lineColor: '#8b9aae',
        textColor: '#111827',
        mainBkg: '#ffffff',
        secondBkg: '#f4f7fb',
        borderColor: '#d9e1ec',
        clusterBkg: '#f7f9fc',
        clusterBorder: '#d9e1ec',
        noteBkgColor: '#fff7e8',
        noteBorderColor: '#f0c36a',
        noteTextColor: '#111827',
        fontSize: '14px'
      },
      flowchart: {
        curve: 'basis',
        htmlLabels: true,
        padding: 16
      },
      sequence: {
        actorMargin: 64,
        boxMargin: 12,
        messageMargin: 42,
        mirrorActors: false
      }
    };

    window.$docsify = {
      name: 'Fastsun 知识库',
      repo: 'https://github.com/fufu223/knowledge-base',
      basePath: '/knowledge-base',
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/_sidebar.md': '/_sidebar.md'
      },
      loadSidebar: true,
      loadNavbar: false,
      homepage: 'README.md',
      subMaxLevel: 0,
      auto2top: true,
      topMargin: 88,
      externalLinkTarget: '_blank',
      routerMode: 'hash',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文档、模块或配置项',
        noData: '没有找到匹配内容',
        depth: 6,
        hideOtherSidebarContent: false,
        namespace: 'fastsun-platform-kb'
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            var language = (lang || '').toLowerCase();
            if (language === 'mermaid') {
              return '<div class="card-mermaid"><div class="mermaid" data-mermaid-source="' +
                encodeURIComponent(code) + '">' + code + '</div></div>';
            }
            if (language === 'java' && window.Prism && Prism.languages.java) {
              return '<pre v-pre class="hljs"><code>' +
                Prism.highlight(code, Prism.languages.java, 'java') +
                '</code></pre>';
            }
            var langClass = language ? ' class="language-' + language + '"' : '';
            return '<pre v-pre class="hljs"><code' + langClass + '>' + code + '</code></pre>';
          }
        }
      },
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true,
        crossChapterText: true
      },
      count: {
        countable: true,
        fontsize: '0.85em',
        color: '#687385',
        language: 'chinese'
      },
      zoomImage: {
        maxWidth: '100%',
        maxHeight: '100%'
      },
      plugins: []
    };
  </script>

  <script>
    const asukaMessages = [
      '工作辛苦了',
      '先读目录会更快',
      '复杂系统也可以很清楚',
      '配置项慢慢查',
      '今天也保持锋利'
    ];
    let asukaMessageIndex = 0;

    function setTheme(theme) {
      const isDark = theme === 'dark';
      document.body.classList.toggle('dark-mode', isDark);
      document.documentElement.classList.toggle('dark-mode', isDark);
      document.getElementById('theme-icon').textContent = isDark ? '☀' : '☾';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      if (window.mermaid) {
        mermaid.initialize(getMermaidConfig());
        renderMermaid();
      }
    }

    function toggleTheme() {
      setTheme(document.body.classList.contains('dark-mode') ? 'light' : 'dark');
    }

    function toggleAsukaMessage() {
      asukaMessageIndex = (asukaMessageIndex + 1) % asukaMessages.length;
      const message = document.getElementById('asuka-message');
      message.textContent = asukaMessages[asukaMessageIndex];
      message.classList.add('is-visible');
      window.clearTimeout(toggleAsukaMessage.timer);
      toggleAsukaMessage.timer = window.setTimeout(function() {
        message.classList.remove('is-visible');
      }, 2200);
    }

    function switchBranch(value) {
      localStorage.setItem('fastsun-kb-branch', value);
    }

    function getMermaidConfig() {
      const config = JSON.parse(JSON.stringify(window.__FASTSUN_MERMAID_THEME__));
      if (document.body.classList.contains('dark-mode')) {
        config.themeVariables.background = '#171a21';
        config.themeVariables.mainBkg = '#1f232b';
        config.themeVariables.primaryColor = '#242a34';
        config.themeVariables.primaryTextColor = '#f6f8fb';
        config.themeVariables.primaryBorderColor = '#3b4656';
        config.themeVariables.secondaryColor = '#203044';
        config.themeVariables.secondaryTextColor = '#f6f8fb';
        config.themeVariables.secondaryBorderColor = '#415a76';
        config.themeVariables.tertiaryColor = '#2a2637';
        config.themeVariables.tertiaryTextColor = '#f6f8fb';
        config.themeVariables.tertiaryBorderColor = '#574a78';
        config.themeVariables.lineColor = '#9aa7b7';
        config.themeVariables.textColor = '#f6f8fb';
        config.themeVariables.secondBkg = '#242a34';
        config.themeVariables.borderColor = '#3b4656';
        config.themeVariables.clusterBkg = '#20242d';
        config.themeVariables.clusterBorder = '#3b4656';
      }
      return config;
    }

    document.addEventListener('DOMContentLoaded', function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(savedTheme || (prefersDark ? 'dark' : 'light'));
      bindShellControls();
    });
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-count@latest/dist/countable.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/medium-zoom/dist/medium-zoom.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/external-script.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <script>
    function bindShellControls() {
      const menuButton = document.querySelector('.kb-menu-button');
      const scrim = document.querySelector('.kb-mobile-scrim');

      function setSidebar(open) {
        document.body.classList.toggle('sidebar-open', open);
        if (menuButton) menuButton.setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      if (menuButton) {
        menuButton.addEventListener('click', function() {
          setSidebar(!document.body.classList.contains('sidebar-open'));
        });
      }

      if (scrim) {
        scrim.addEventListener('click', function() {
          setSidebar(false);
        });
      }

      document.addEventListener('click', function(event) {
        const link = event.target.closest('.sidebar a');
        if (link && window.innerWidth <= 1024) {
          setSidebar(false);
        }
      });
    }

    function moveSearchToTopbar() {
      const search = document.querySelector('.sidebar .search');
      const slot = document.getElementById('kb-search-slot');
      if (!search || !slot || slot.contains(search)) return;
      slot.innerHTML = '';
      slot.appendChild(search);
    }

    function enhanceSidebarBrand() {
      const sidebar = document.querySelector('.sidebar');
      if (!sidebar || sidebar.querySelector('.kb-sidebar-brand')) return;

      const brand = document.createElement('div');
      brand.className = 'kb-sidebar-brand';
      brand.innerHTML =
        '<img src="images/logo.png" alt="" class="kb-sidebar-logo">' +
        '<div><strong>Fastsun Docs</strong><span>多租户框架知识库</span></div>';

      const nav = sidebar.querySelector('.sidebar-nav');
      sidebar.insertBefore(brand, nav || sidebar.firstChild);
    }

    function buildChapterNav() {
      const content = document.querySelector('.markdown-section');
      if (!content) return;

      const oldNav = content.querySelector('.chapter-nav');
      if (oldNav) oldNav.remove();

      const headings = Array.from(content.querySelectorAll('h2, h3')).filter(function(heading) {
        return heading.textContent.trim().length > 0;
      });
      if (!headings.length) return;

      const details = document.createElement('details');
      details.className = 'chapter-nav';
      details.open = window.innerWidth >= 900 && headings.length <= 8;

      const summary = document.createElement('summary');
      summary.innerHTML = '<span>本页章节</span><small>' + headings.length + ' 个节点</small>';
      details.appendChild(summary);

      const list = document.createElement('nav');
      list.setAttribute('aria-label', '本页章节');

      headings.forEach(function(heading) {
        if (!heading.id) {
          heading.id = heading.textContent.trim().replace(/\s+/g, '-').toLowerCase();
        }
        const link = document.createElement('a');
        link.href = '#' + encodeURIComponent(heading.id);
        link.textContent = heading.textContent.trim();
        link.className = heading.tagName.toLowerCase() === 'h3' ? 'is-subsection' : '';
        link.addEventListener('click', function(event) {
          event.preventDefault();
          scrollToHeading(heading);
        });
        list.appendChild(link);
      });

      details.appendChild(list);
      const first = content.firstElementChild;
      content.insertBefore(details, first);
      observeActiveChapter(headings, list);
    }

    function observeActiveChapter(headings, nav) {
      const links = Array.from(nav.querySelectorAll('a'));
      if (!('IntersectionObserver' in window)) return;

      const observer = new IntersectionObserver(function(entries) {
        const visible = entries
          .filter(function(entry) { return entry.isIntersecting; })
          .sort(function(a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; })[0];
        if (!visible) return;
        const index = headings.indexOf(visible.target);
        links.forEach(function(link, i) {
          link.classList.toggle('is-active', i === index);
        });
      }, {
        root: null,
        rootMargin: '-96px 0px -72% 0px',
        threshold: 0.01
      });

      headings.forEach(function(heading) {
        observer.observe(heading);
      });
    }

    function scrollToHeading(heading) {
      heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
      history.replaceState(null, '', window.location.hash.split('?id=')[0] + '?id=' + encodeURIComponent(heading.id));
    }

    function handleAnchorScroll() {
      const hash = window.location.hash;
      let anchorId = '';
      if (hash.includes('?id=')) {
        anchorId = hash.split('?id=')[1].split('&')[0];
      } else if (hash.includes('#') && hash.lastIndexOf('#') > 0) {
        anchorId = hash.substring(hash.lastIndexOf('#') + 1);
      }
      if (!anchorId) return;

      const decoded = decodeURIComponent(anchorId);
      const element = document.getElementById(anchorId) || document.getElementById(decoded);
      if (element) {
        window.setTimeout(function() {
          element.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 80);
      }
    }

    function renderMermaid() {
      if (!window.mermaid) return;
      const nodes = document.querySelectorAll('.card-mermaid .mermaid');
      nodes.forEach(function(node) {
        const source = node.getAttribute('data-mermaid-source');
        if (source) {
          node.innerHTML = decodeURIComponent(source);
        }
        node.removeAttribute('data-processed');
      });
      mermaid.run({ nodes: nodes });
    }

    function initMermaidViewer() {
      let viewer = null;
      let scale = 1;
      let panX = 0;
      let panY = 0;
      let dragging = false;
      let dragStartX = 0;
      let dragStartY = 0;
      let panStartX = 0;
      let panStartY = 0;
      let sourceWidth = 800;
      let sourceHeight = 600;

      document.addEventListener('click', function(event) {
        const card = event.target.closest('.card-mermaid');
        if (!card || event.target.closest('.mermaid-viewer')) return;
        const svg = card.querySelector('svg');
        if (!svg) return;
        event.preventDefault();
        openViewer(card, svg);
      });

      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') closeViewer();
      });

      document.addEventListener('wheel', function(event) {
        if (!viewer || !viewer.classList.contains('active')) return;
        event.preventDefault();
        zoomAt(event.clientX, event.clientY, event.deltaY > 0 ? 0.9 : 1.1);
      }, { passive: false });

      function openViewer(card, svg) {
        closeViewer();
        const rect = svg.getBoundingClientRect();
        sourceWidth = rect.width || 800;
        sourceHeight = rect.height || 600;

        viewer = document.createElement('div');
        viewer.className = 'mermaid-viewer';
        viewer.innerHTML =
          '<div class="mermaid-viewer-toolbar">' +
          '<button class="v-zoomout" title="缩小">−</button>' +
          '<span class="mermaid-viewer-zoom-label">100%</span>' +
          '<button class="v-zoomin" title="放大">+</button>' +
          '<button class="v-fit" title="适应屏幕">⊡</button>' +
          '<button class="v-close" title="关闭">×</button>' +
          '</div>' +
          '<div class="mermaid-viewer-hint">滚轮缩放 · 拖拽平移 · 双击适应屏幕 · Esc 关闭</div>';

        const clone = card.querySelector('.mermaid').cloneNode(true);
        clone.style.cssText = 'display:block;transform-origin:0 0;';
        viewer.appendChild(clone);
        document.body.appendChild(viewer);

        viewer.querySelector('.v-zoomin').addEventListener('click', function(event) {
          event.stopPropagation();
          zoomAt(window.innerWidth / 2, window.innerHeight / 2, 1.25);
        });
        viewer.querySelector('.v-zoomout').addEventListener('click', function(event) {
          event.stopPropagation();
          zoomAt(window.innerWidth / 2, window.innerHeight / 2, 0.8);
        });
        viewer.querySelector('.v-fit').addEventListener('click', function(event) {
          event.stopPropagation();
          fitToScreen();
        });
        viewer.querySelector('.v-close').addEventListener('click', function(event) {
          event.stopPropagation();
          closeViewer();
        });
        viewer.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', moveDrag);
        document.addEventListener('mouseup', endDrag);
        viewer.addEventListener('dblclick', fitToScreen);

        fitToScreen();
        requestAnimationFrame(function() {
          viewer.classList.add('active');
        });
      }

      function startDrag(event) {
        if (event.target.closest('.mermaid-viewer-toolbar')) return;
        dragging = true;
        dragStartX = event.clientX;
        dragStartY = event.clientY;
        panStartX = panX;
        panStartY = panY;
        viewer.classList.add('dragging');
      }

      function moveDrag(event) {
        if (!dragging || !viewer) return;
        panX = panStartX + event.clientX - dragStartX;
        panY = panStartY + event.clientY - dragStartY;
        applyTransform();
      }

      function endDrag() {
        dragging = false;
        if (viewer) viewer.classList.remove('dragging');
      }

      function fitToScreen() {
        if (!viewer) return;
        scale = Math.min(window.innerWidth / sourceWidth, window.innerHeight / sourceHeight) * 0.82;
        panX = (window.innerWidth - sourceWidth * scale) / 2;
        panY = (window.innerHeight - sourceHeight * scale) / 2;
        applyTransform();
      }

      function zoomAt(cx, cy, factor) {
        const nextScale = Math.max(0.08, Math.min(8, scale * factor));
        const sx = (cx - panX) / scale;
        const sy = (cy - panY) / scale;
        panX = cx - sx * nextScale;
        panY = cy - sy * nextScale;
        scale = nextScale;
        applyTransform();
      }

      function applyTransform() {
        const canvas = viewer && viewer.querySelector('.mermaid');
        if (!canvas) return;
        canvas.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
        viewer.querySelector('.mermaid-viewer-zoom-label').textContent = Math.round(scale * 100) + '%';
      }

      function closeViewer() {
        if (!viewer) return;
        const closing = viewer;
        closing.classList.remove('active');
        window.setTimeout(function() {
          if (closing.parentNode) closing.parentNode.removeChild(closing);
        }, 180);
        viewer = null;
      }
    }

    window.$docsify.plugins = (window.$docsify.plugins || []).concat(function(hook) {
      hook.doneEach(function() {
        window.setTimeout(function() {
          moveSearchToTopbar();
          enhanceSidebarBrand();
          buildChapterNav();
          handleAnchorScroll();
          if (window.mediumZoom) {
            mediumZoom('.markdown-section img:not(.emoji):not([data-no-zoom]):not(.kb-asuka-img)', {
              background: 'rgba(17, 24, 39, 0.68)',
              margin: 40
            });
          }
          if (window.mermaid) {
            mermaid.initialize(getMermaidConfig());
            renderMermaid();
          }
        }, 120);
      });
    });

    document.addEventListener('DOMContentLoaded', function() {
      initMermaidViewer();
    });

    window.addEventListener('hashchange', function() {
      window.setTimeout(handleAnchorScroll, 160);
    });
  </script>
</body>
</html>
