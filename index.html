<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Fastsun Platform 知识库</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Fastsun 平台框架完整技术文档">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- 网页图标 -->
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  
  <!-- Docsify 主题 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <!-- 现代化苹果风格主题 -->
  <link rel="stylesheet" href="theme-modern.css">
</head>
<body>
  <div id="app">加载中...</div>
  
  <!-- 右侧目录边栏 -->
  <div class="right-sidebar" id="right-sidebar"></div>
  
  <!-- 分支版本标识 -->
  <div class="branch-badge" id="branch-badge">
    <span class="branch-label">分支:</span>
    <select class="branch-select" id="branch-select" onchange="switchBranch(this.value)">
      <option value="2.3.26-20260509-1-RELEASE" selected>2.3.26-20260509-1-RELEASE</option>
    </select>
  </div>
  
  <!-- 动漫助手 -->
  <div class="anime-helper" onclick="toggleAnimeMessage()">
    <div class="anime-helper-bubble">
      <div class="anime-helper-bubble-text" id="anime-message">💪 工作辛苦了！</div>
    </div>
    <div class="anime-helper-container">
      <img src="images/anime-helper.png" alt="文档助手" class="anime-helper-img">
    </div>
  </div>
  
  <!-- 黑暗模式开关 -->
  <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
    <span id="theme-icon">🌙</span>
  </button>
  
  <script>
    window.$docsify = {
      name: 'Fastsun 知识库',
      repo: 'https://github.com/fufu223/knowledge-base',
      
      // 基础路径配置（重要！）时设置为 '/'
      // GitHub Pages 部署时设置为 '/仓库名/'
      // 例如：仓库名为 knowledge-base，则设置为 '/knowledge-base/'
      basePath: '/knowledge-base/',  // 本地预览使用 '/'，部署时修改为仓库名
      
      // 路由别名配置（解决GitHub Pages下划线文件问题）
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/_sidebar.md': '/_sidebar.md'
      },
      
      // 侧边栏配置
      loadSidebar: true,
      loadNavbar: false,
      homepage: 'README.md',  // 首页文件
      subMaxLevel: 0,  // 页面标题不自动加入左侧边栏（交给右侧边栏）
      auto2top: false,  // 由 doneEach 钩子手动控制回到顶部
      
      // 锚点定位偏移量（重要！）
      topMargin: 100,  // 考虑固定元素的高度，避免锚点被遮挡
      
      // 外部链接处理
      externalLinkTarget: '_blank',
      
      // 路由模式
      routerMode: 'hash',
      
      // 搜索功能
      search: {
        maxAge: 86400000, // 缓存一天
        paths: 'auto',
        placeholder: '搜索文档...',
        noData: '找不到结果',
        depth: 6,
        hideOtherSidebarContent: false,
        namespace: 'fastsun-kb'
      },
      
      // 代码高亮
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === 'mermaid') {
              return '<div class="mermaid">' + code + '</div>';
            }
            if (lang === 'java') {
              return '<pre v-pre class="hljs"><code>' +
                Prism.highlight(code, Prism.languages.java, 'java') +
                '</code></pre>';
            }
            var langClass = lang ? ' class="language-' + lang + '"' : '';
            return '<pre v-pre class="hljs"><code' + langClass + '>' + code + '</code></pre>';
          }
        }
      },
      
      // 分页导航
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true,
        crossChapterText: true
      },
      
      // 字数统计
      count: {
        countable: true,
        fontsize: '0.9em',
        color: 'rgb(90,90,90)',
        language: 'chinese'
      },
      
      // 图片缩放
      zoomImage: {
        maxWidth: '100%',
        maxHeight: '100%'
      }
    }
  </script>
  
  <!-- 动漫助手脚本 -->
  <script>
    const animeMessages = [
      '💪 工作辛苦了！',
      '☕ 休息一下吧~',
      '✨ 你做得很棒！',
      '🌟 继续加油哦！',
      '💖 注意身体呀~',
      '🎯 保持专注！',
      '😊 开心工作~',
      '🌈 美好的一天！'
    ];
    let messageIndex = 0;
    
    function toggleAnimeMessage() {
      messageIndex = (messageIndex + 1) % animeMessages.length;
      const bubble = document.getElementById('anime-message');
      bubble.style.opacity = '0';
      bubble.style.transform = 'translateY(-10px)';
      
      setTimeout(() => {
        bubble.textContent = animeMessages[messageIndex];
        bubble.style.opacity = '1';
        bubble.style.transform = 'translateY(0)';
      }, 200);
    }
    
    // 黑暗模式切换
    function toggleTheme() {
      const body = document.body;
      const icon = document.getElementById('theme-icon');
      body.classList.toggle('dark-mode');
      
      if (body.classList.contains('dark-mode')) {
        icon.textContent = '☀️';
        localStorage.setItem('theme', 'dark');
      } else {
        icon.textContent = '🌙';
        localStorage.setItem('theme', 'light');
      }
    }
    
    // 页面加载时恢复主题设置
    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('theme-icon').textContent = '☀️';
      }
    });
  </script>
  
  <!-- Docsify 核心 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  
  <!-- 搜索插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  
  <!-- 代码高亮 -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  
  <!-- 分页插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  
  <!-- 字数统计 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-count@latest/dist/countable.min.js"></script>
  
  <!-- 图片缩放 -->
  <script src="//cdn.jsdelivr.net/npm/medium-zoom/dist/medium-zoom.min.js"></script>
  <script>
    window.$docsify.plugins = (window.$docsify.plugins || []).concat(function(hook) {
      hook.doneEach(function() {
        setTimeout(function() {
          mediumZoom('.markdown-section img:not(.emoji):not([data-no-zoom])', {
            background: 'rgba(0, 0, 0, 0.5)',
            margin: 40
          });
        }, 500);
      });
    });
  </script>
  
  <!-- 外部链接图标 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/external-script.min.js"></script>
  
  <!-- Mermaid.js 图表渲染 -->
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  
  <!-- Mermaid 初始化 -->
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'default',
      securityLevel: 'loose'
    });
  </script>

  <!-- 右侧目录边栏 + Mermaid 渲染 + 全屏查看器 插件 -->
  <script>
    (function() {
      // ==================== Mermaid 全屏查看器 ====================
      var viewer = null;        // .mermaid-viewer DOM
      var imgEl = null;         // 查看器中的 <img>（自包含 SVG）
      var zoomLabel = null;     // 缩放比例标签

      // 视图状态
      var scale = 1;
      var panX = 0, panY = 0;
      // 原始尺寸
      var imgW = 0, imgH = 0;

      // 拖拽状态
      var dragging = false;
      var dragStartX = 0, dragStartY = 0;
      var panStartX = 0, panStartY = 0;

      // 最小/最大缩放
      var MIN_SCALE = 0.05;
      var MAX_SCALE = 10;

      function initViewer() {
        document.addEventListener('click', function(e) {
          var mermaidEl = e.target.closest('.markdown-section .mermaid');
          if (mermaidEl && !e.target.closest('.mermaid-viewer')) {
            e.preventDefault();
            e.stopPropagation();
            openViewer(mermaidEl);
          }
        });

        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' && viewer && viewer.classList.contains('active')) {
            e.preventDefault();
            closeViewer();
          }
        });

        document.addEventListener('wheel', function(e) {
          if (!viewer || !viewer.classList.contains('active')) return;
          e.preventDefault();
          var delta = e.deltaY > 0 ? 0.9 : 1.1;
          zoomAtPoint(e.clientX, e.clientY, delta);
        }, { passive: false });
      }

      function openViewer(sourceEl) {
        closeViewer();

        var srcSvg = sourceEl.querySelector('svg');
        if (!srcSvg) return;

        // 从原始已渲染 SVG 获取可见尺寸
        var rect = srcSvg.getBoundingClientRect();
        imgW = rect.width || 800;
        imgH = rect.height || 600;

        // 创建全屏容器
        viewer = document.createElement('div');
        viewer.className = 'mermaid-viewer';

        // 工具栏
        var toolbar = document.createElement('div');
        toolbar.className = 'mermaid-viewer-toolbar';
        toolbar.innerHTML =
          '<button class="v-zoomout" title="缩小">−</button>' +
          '<span class="mermaid-viewer-zoom-label">100%</span>' +
          '<button class="v-zoomin" title="放大">+</button>' +
          '<button class="v-fit" title="适应屏幕">⊡</button>' +
          '<button class="v-close" title="关闭 (Esc)">✕</button>';
        viewer.appendChild(toolbar);

        // 底部提示
        var hint = document.createElement('div');
        hint.className = 'mermaid-viewer-hint';
        hint.textContent = '滚轮缩放 · 拖拽平移 · 双击适应屏幕 · Esc 关闭';
        viewer.appendChild(hint);

        // 克隆整个 .mermaid 容器，不改动任何属性，颜色与页面完全一致
        var clone = sourceEl.cloneNode(true);
        clone.id = '';
        clone.style.cssText = 'display:block;transform-origin:0 0;';
        viewer.appendChild(clone);
        document.body.appendChild(viewer);

        zoomLabel = viewer.querySelector('.mermaid-viewer-zoom-label');
        fitToScreen();
        requestAnimationFrame(function() {
          viewer.classList.add('active');
        });
        setTimeout(function() {
          if (hint) hint.classList.add('hidden');
        }, 3000);

        // --- 事件绑定 ---
        toolbar.querySelector('.v-zoomin').addEventListener('click', function(e) {
          e.stopPropagation();
          zoomAtCenter(1.3);
        });
        toolbar.querySelector('.v-zoomout').addEventListener('click', function(e) {
          e.stopPropagation();
          zoomAtCenter(0.7);
        });
        toolbar.querySelector('.v-fit').addEventListener('click', function(e) {
          e.stopPropagation();
          fitToScreen();
        });
        toolbar.querySelector('.v-close').addEventListener('click', function(e) {
          e.stopPropagation();
          closeViewer();
        });

        viewer.addEventListener('mousedown', function(e) {
          if (e.target.closest('.mermaid-viewer-toolbar')) return;
          dragging = true;
          dragStartX = e.clientX;
          dragStartY = e.clientY;
          panStartX = panX;
          panStartY = panY;
          viewer.classList.add('dragging');
        });

        document.addEventListener('mousemove', function(e) {
          if (!dragging) return;
          panX = panStartX + (e.clientX - dragStartX);
          panY = panStartY + (e.clientY - dragStartY);
          applyTransform();
        });

        document.addEventListener('mouseup', function() {
          if (dragging) {
            dragging = false;
            if (viewer) viewer.classList.remove('dragging');
          }
        });

        viewer.addEventListener('touchstart', function(e) {
          if (e.target.closest('.mermaid-viewer-toolbar')) return;
          if (e.touches.length === 1) {
            dragging = true;
            dragStartX = e.touches[0].clientX;
            dragStartY = e.touches[0].clientY;
            panStartX = panX;
            panStartY = panY;
          }
        }, { passive: true });

        viewer.addEventListener('touchmove', function(e) {
          if (!dragging || e.touches.length !== 1) return;
          e.preventDefault();
          panX = panStartX + (e.touches[0].clientX - dragStartX);
          panY = panStartY + (e.touches[0].clientY - dragStartY);
          applyTransform();
        }, { passive: false });

        viewer.addEventListener('touchend', function() {
          dragging = false;
        });

        viewer.addEventListener('dblclick', function(e) {
          if (e.target.closest('.mermaid-viewer-toolbar')) return;
          e.preventDefault();
          fitToScreen();
        });
      }

      function applyTransform() {
        var el = viewer && viewer.querySelector('.mermaid');
        if (!el) return;
        el.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
        if (zoomLabel) {
          zoomLabel.textContent = Math.round(scale * 100) + '%';
        }
      }

      function fitToScreen() {
        if (!viewer || imgW < 1) return;
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var fitScale = Math.min(vw / imgW, vh / imgH) * 0.85;
        scale = fitScale;
        panX = (vw - imgW * scale) / 2;
        panY = (vh - imgH * scale) / 2;
        applyTransform();
      }

      function zoomAtCenter(factor) {
        if (!viewer) return;
        zoomAtPoint(window.innerWidth / 2, window.innerHeight / 2, factor);
      }

      function zoomAtPoint(cx, cy, factor) {
        var newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * factor));
        var sx = (cx - panX) / scale;
        var sy = (cy - panY) / scale;
        panX = cx - sx * newScale;
        panY = cy - sy * newScale;
        scale = newScale;
        applyTransform();
      }

      function closeViewer() {
        if (viewer) {
          viewer.classList.remove('active');
          var v = viewer;
          setTimeout(function() {
            if (v && v.parentNode) v.parentNode.removeChild(v);
          }, 300);
          viewer = null;
          imgEl = null;
          zoomLabel = null;
          scale = 1;
          panX = 0;
          panY = 0;
          imgW = 0;
          imgH = 0;
          dragging = false;
        }
      }

      // 初始化
      initViewer();

      // ==================== 右侧目录边栏 ====================
      function buildRightSidebar() {
        var sidebar = document.getElementById('right-sidebar');
        if (!sidebar) return;

        var content = document.querySelector('.markdown-section');
        if (!content) { sidebar.innerHTML = ''; return; }

        var headings = content.querySelectorAll('h2, h3');
        if (headings.length === 0) { sidebar.innerHTML = ''; return; }

        var html = '<div class="right-sidebar-title">本页目录</div><nav class="right-sidebar-nav"><ul>';
        headings.forEach(function(h) {
          var id = h.id || h.textContent.trim().replace(/\s+/g, '-').toLowerCase();
          var text = h.textContent.trim();
          var tag = h.tagName.toLowerCase();
          if (tag === 'h3') {
            html += '<li class="h3-item"><a href="#' + id + '" class="h3-link">' + text + '</a></li>';
          } else {
            html += '<li><a href="#' + id + '">' + text + '</a></li>';
          }
        });
        html += '</ul></nav>';
        sidebar.innerHTML = html;

        // 绑定点击事件：平滑滚动 + 仅更新 hash fragment（不改变路由路径）
        sidebar.querySelectorAll('a').forEach(function(a) {
          a.addEventListener('click', function(e) {
            e.preventDefault();
            var targetId = this.getAttribute('href').substring(1);
            var target = document.getElementById(targetId);
            if (!target) {
              target = document.querySelector('[id="' + targetId + '"]');
            }
            if (!target) {
              target = document.getElementById(decodeURIComponent(targetId));
            }
            if (target) {
              target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            // 高亮当前点击项
            sidebar.querySelectorAll('a').forEach(function(a2) { a2.classList.remove('active-section'); });
            this.classList.add('active-section');
          });
        });
      }

      // 滚动监听：高亮当前章节
      function updateActiveSection() {
        var sidebar = document.getElementById('right-sidebar');
        if (!sidebar) return;
        var links = sidebar.querySelectorAll('a');
        if (links.length === 0) return;

        var content = document.querySelector('.markdown-section');
        if (!content) return;

        var headings = content.querySelectorAll('h2, h3');
        if (headings.length === 0) return;

        var scrollTop = content.scrollTop || 0;

        // 默认选中第一个（未滚动或未渲染完成时始终为首项）
        var activeIndex = 0;

        // 只有在已滚动且标题已渲染的情况下才计算
        if (scrollTop > 20 && headings[0].offsetTop > 0) {
          headings.forEach(function(h, i) {
            if (h.offsetTop <= scrollTop + 100) {
              activeIndex = i;
            }
          });
        }

        links.forEach(function(link, i) {
          link.classList.toggle('active-section', i === activeIndex);
        });
      }

      // Docsify 插件
      window.$docsify = window.$docsify || {};
      var existingPlugins = window.$docsify.plugins || [];
      window.$docsify.plugins = existingPlugins.concat(function(hook) {
        hook.doneEach(function() {
          // 构建右侧边栏
          buildRightSidebar();

          // 重置内容区滚动位置（Docsify 复用 DOM，innerHTML 替换不会重置 scrollTop）
          var content = document.querySelector('.markdown-section');
          if (content) content.scrollTop = 0;

          // 立即高亮首个目录项
          updateActiveSection();

          // 渲染 Mermaid 图表
          setTimeout(function() {
            if (typeof mermaid !== 'undefined') {
              mermaid.run({ nodes: document.querySelectorAll('.mermaid') });
            }
          }, 300);
        });
      });

      // 内容区滚动监听（用于高亮当前章节）
      document.addEventListener('DOMContentLoaded', function() {
        var content = document.querySelector('.markdown-section');
        if (content) {
          content.addEventListener('scroll', function() {
            requestAnimationFrame(updateActiveSection);
          });
        }
      });
    })();
  </script>

  <!-- 锚点定位修复脚本 -->
  <script>
    // 等待 Docsify 初始化完成后处理锚点定位
    document.addEventListener('DOMContentLoaded', function() {
      // 延迟执行确保 DOM 完全加载
      setTimeout(function() {
        handleAnchorScroll();
      }, 500);
    });
    
    // 处理锚点滚动的函数
    function handleAnchorScroll() {
      // 从 URL 中提取锚点 ID
      let anchorId = null;
      const hash = window.location.hash;
      
      // Docsify 格式: #/path/file?id=anchor 或 #/path/file#anchor
      if (hash.includes('?id=')) {
        anchorId = hash.split('?id=')[1].split('&')[0];
      } else if (hash.includes('#') && hash.lastIndexOf('#') > 0) {
        anchorId = hash.substring(hash.lastIndexOf('#') + 1);
      } else if (hash.startsWith('#') && hash.length > 1 && !hash.includes('/')) {
        anchorId = hash.substring(1);
      }
      
      if (anchorId) {
        // 尝试多种选择器查找元素
        let element = document.getElementById(anchorId);
        if (!element) {
          element = document.querySelector('[id="' + anchorId + '"]');
        }
        if (!element) {
          // 尝试解码后的 ID（处理中文）
          element = document.getElementById(decodeURIComponent(anchorId));
        }
        
        if (element) {
          scrollToElement(element);
        }
      }
    }
    
    // 滚动到指定元素的通用函数（使用原生 scrollIntoView 避免容器布局偏移）
    function scrollToElement(element) {
      element.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    
    // 监听所有锚点链接点击事件（包括侧边栏和页面内链接）
    document.addEventListener('click', function(e) {
      const link = e.target.closest('a');
      if (!link) return;
      
      const href = link.getAttribute('href');
      if (!href) return;
      
      // 只拦截同页面锚点链接 (如 #section-name)，放行跨页链接给 Docsify 处理
      // 搜索结果的链接格式为 #/path/to/page?id=xxx，包含 / 或 ?id=，不属于同页面锚点
      const isSamePageAnchor = href.startsWith('#') && !href.includes('/') && !href.includes('?id=');
      
      if (isSamePageAnchor) {
        e.preventDefault();
        
        const anchorId = href.substring(1);
        
        // 尝试多种选择器查找元素
        let targetElement = document.getElementById(anchorId);
        if (!targetElement) {
          targetElement = document.querySelector('[id="' + anchorId + '"]');
        }
        if (!targetElement) {
          targetElement = document.getElementById(decodeURIComponent(anchorId));
        }
        
        if (targetElement) {
          scrollToElement(targetElement);
        } else {
          // 如果元素还没渲染，延迟重试
          setTimeout(function() {
            let retryElement = document.getElementById(anchorId);
            if (!retryElement) {
              retryElement = document.getElementById(decodeURIComponent(anchorId));
            }
            if (retryElement) {
              scrollToElement(retryElement);
            }
          }, 300);
        }
      }
    });
    
    // 监听浏览器前进/后退按钮
    window.addEventListener('popstate', function() {
      setTimeout(handleAnchorScroll, 100);
    });
    
    // 监听路由变化（Docsify 内部路由）
    window.addEventListener('hashchange', function() {
      setTimeout(handleAnchorScroll, 300);
    });
    
    // Docsify 渲染完成后的钩子
    window.$docsify = window.$docsify || {};
    const originalInit = window.$docsify.plugins || [];
    window.$docsify.plugins = originalInit.concat(function(hook) {
      // 每次路由切换后处理锚点
      hook.doneEach(function() {
        setTimeout(handleAnchorScroll, 200);
      });
    });
  </script>
</body>
</html>
