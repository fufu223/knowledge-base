<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Fastsun Platform 知识库</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Fastsun 平台框架完整技术文档">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- 网页图标 -->
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  
  <!-- Docsify 主题 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <!-- 现代化苹果风格主题 -->
  <link rel="stylesheet" href="theme-modern.css">
</head>
<body>
  <div id="app">加载中...</div>
  
  <!-- 分支版本标识 -->
  <div class="branch-badge" id="branch-badge">
    <span class="branch-label">分支:</span>
    <select class="branch-select" id="branch-select" onchange="switchBranch(this.value)">
      <option value="2.3.26-20260509-1-RELEASE" selected>2.3.26-20260509-1-RELEASE</option>
    </select>
  </div>
  
  <!-- 动漫助手 -->
  <div class="anime-helper" onclick="toggleAnimeMessage()">
    <div class="anime-helper-bubble">
      <div class="anime-helper-bubble-text" id="anime-message">💪 工作辛苦了！</div>
    </div>
    <div class="anime-helper-container">
      <img src="images/anime-helper.png" alt="文档助手" class="anime-helper-img">
    </div>
  </div>
  
  <!-- 黑暗模式开关 -->
  <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
    <span id="theme-icon">🌙</span>
  </button>
  
  <script>
    window.$docsify = {
      name: 'Fastsun 知识库',
      repo: 'https://github.com/fufu223/knowledge-base',
      
      // 基础路径配置（重要！）时设置为 '/'
      // GitHub Pages 部署时设置为 '/仓库名/'
      // 例如：仓库名为 knowledge-base，则设置为 '/knowledge-base/'
      basePath: '/knowledge-base/',  // 本地预览使用 '/'，部署时修改为仓库名
      
      // 路由别名配置（解决GitHub Pages下划线文件问题）
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/_sidebar.md': '/_sidebar.md'
      },
      
      // 侧边栏配置
      loadSidebar: true,
      loadNavbar: false,
      homepage: 'README.md',  // 首页文件
      subMaxLevel: 3,  // 侧边栏最大层级
      auto2top: false,  // 由 doneEach 钩子手动控制回到顶部
      
      // 锚点定位偏移量（重要！）
      topMargin: 100,  // 考虑固定元素的高度，避免锚点被遮挡
      
      // 外部链接处理
      externalLinkTarget: '_blank',
      
      // 路由模式
      routerMode: 'hash',
      
      // 搜索功能
      search: {
        maxAge: 86400000, // 缓存一天
        paths: 'auto',
        placeholder: '搜索文档...',
        noData: '找不到结果',
        depth: 6,
        hideOtherSidebarContent: false,
        namespace: 'fastsun-kb'
      },
      
      // 代码高亮
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === 'java') {
              return '<pre class="hljs"><code>' + 
                Prism.highlight(code, Prism.languages.java, 'java') + 
                '</code></pre>';
            }
            return '<pre class="hljs"><code>' + code + '</code></pre>';
          }
        }
      },
      
      // 分页导航
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true,
        crossChapterText: true
      },
      
      // 字数统计
      count: {
        countable: true,
        fontsize: '0.9em',
        color: 'rgb(90,90,90)',
        language: 'chinese'
      },
      
      // 图片缩放
      zoomImage: {
        maxWidth: '100%',
        maxHeight: '100%'
      }
    }
  </script>
  
  <!-- 动漫助手脚本 -->
  <script>
    const animeMessages = [
      '💪 工作辛苦了！',
      '☕ 休息一下吧~',
      '✨ 你做得很棒！',
      '🌟 继续加油哦！',
      '💖 注意身体呀~',
      '🎯 保持专注！',
      '😊 开心工作~',
      '🌈 美好的一天！'
    ];
    let messageIndex = 0;
    
    function toggleAnimeMessage() {
      messageIndex = (messageIndex + 1) % animeMessages.length;
      const bubble = document.getElementById('anime-message');
      bubble.style.opacity = '0';
      bubble.style.transform = 'translateY(-10px)';
      
      setTimeout(() => {
        bubble.textContent = animeMessages[messageIndex];
        bubble.style.opacity = '1';
        bubble.style.transform = 'translateY(0)';
      }, 200);
    }
    
    // 黑暗模式切换
    function toggleTheme() {
      const body = document.body;
      const icon = document.getElementById('theme-icon');
      body.classList.toggle('dark-mode');
      
      if (body.classList.contains('dark-mode')) {
        icon.textContent = '☀️';
        localStorage.setItem('theme', 'dark');
      } else {
        icon.textContent = '🌙';
        localStorage.setItem('theme', 'light');
      }
    }
    
    // 页面加载时恢复主题设置
    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('theme-icon').textContent = '☀️';
      }
    });
  </script>
  
  <!-- Docsify 核心 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  
  <!-- 搜索插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  
  <!-- 代码高亮 -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  
  <!-- 分页插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  
  <!-- 字数统计 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-count@latest/dist/countable.min.js"></script>
  
  <!-- 图片缩放 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-zoom-image@1/dist/docsify-zoom-image.min.js"></script>
  
  <!-- 外部链接图标 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/external-script.min.js"></script>
  
  <!-- 锚点定位修复脚本 -->
  <script>
    // 等待 Docsify 初始化完成后处理锚点定位
    document.addEventListener('DOMContentLoaded', function() {
      // 延迟执行确保 DOM 完全加载
      setTimeout(function() {
        handleAnchorScroll();
      }, 500);
    });
    
    // 处理锚点滚动的函数
    function handleAnchorScroll() {
      // 从 URL 中提取锚点 ID
      let anchorId = null;
      const hash = window.location.hash;
      
      // Docsify 格式: #/path/file?id=anchor 或 #/path/file#anchor
      if (hash.includes('?id=')) {
        anchorId = hash.split('?id=')[1].split('&')[0];
      } else if (hash.includes('#') && hash.lastIndexOf('#') > 0) {
        anchorId = hash.substring(hash.lastIndexOf('#') + 1);
      } else if (hash.startsWith('#') && hash.length > 1 && !hash.includes('/')) {
        anchorId = hash.substring(1);
      }
      
      if (anchorId) {
        // 尝试多种选择器查找元素
        let element = document.getElementById(anchorId);
        if (!element) {
          element = document.querySelector('[id="' + anchorId + '"]');
        }
        if (!element) {
          // 尝试解码后的 ID（处理中文）
          element = document.getElementById(decodeURIComponent(anchorId));
        }
        
        if (element) {
          scrollToElement(element);
        }
      }
    }
    
    // 滚动到指定元素的通用函数（使用原生 scrollIntoView 避免容器布局偏移）
    function scrollToElement(element) {
      element.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    
    // 监听所有锚点链接点击事件（包括侧边栏和页面内链接）
    document.addEventListener('click', function(e) {
      const link = e.target.closest('a');
      if (!link) return;
      
      const href = link.getAttribute('href');
      if (!href) return;
      
      // 只拦截同页面锚点链接 (如 #section-name)，放行跨页链接给 Docsify 处理
      // 搜索结果的链接格式为 #/path/to/page?id=xxx，包含 / 或 ?id=，不属于同页面锚点
      const isSamePageAnchor = href.startsWith('#') && !href.includes('/') && !href.includes('?id=');
      
      if (isSamePageAnchor) {
        e.preventDefault();
        
        const anchorId = href.substring(1);
        
        // 尝试多种选择器查找元素
        let targetElement = document.getElementById(anchorId);
        if (!targetElement) {
          targetElement = document.querySelector('[id="' + anchorId + '"]');
        }
        if (!targetElement) {
          targetElement = document.getElementById(decodeURIComponent(anchorId));
        }
        
        if (targetElement) {
          scrollToElement(targetElement);
          // 更新 URL
          history.pushState(null, null, href);
        } else {
          // 如果元素还没渲染，延迟重试
          setTimeout(function() {
            let retryElement = document.getElementById(anchorId);
            if (!retryElement) {
              retryElement = document.getElementById(decodeURIComponent(anchorId));
            }
            if (retryElement) {
              scrollToElement(retryElement);
            }
          }, 300);
        }
      }
    });
    
    // 监听浏览器前进/后退按钮
    window.addEventListener('popstate', function() {
      setTimeout(handleAnchorScroll, 100);
    });
    
    // 监听路由变化（Docsify 内部路由）
    window.addEventListener('hashchange', function() {
      setTimeout(handleAnchorScroll, 300);
    });
    
    // Docsify 渲染完成后的钩子
    window.$docsify = window.$docsify || {};
    const originalInit = window.$docsify.plugins || [];
    window.$docsify.plugins = originalInit.concat(function(hook) {
      // 每次路由切换后处理锚点
      hook.doneEach(function() {
        setTimeout(handleAnchorScroll, 200);
      });
    });
  </script>
</body>
</html>
